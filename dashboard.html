<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Z-SDNet Security Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 750px; background: #1e293b; border-radius: 12px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h1 { margin-top: 0; color: #38bdf8; font-size: 24px; display: flex; align-items: center; justify-content: space-between; }
    .status-badge { font-size: 13px; background: #0284c7; padding: 4px 10px; border-radius: 20px; color: white; }
    .card { background: #334155; border-radius: 8px; padding: 18px; margin-bottom: 20px; }
    h2 { font-size: 16px; margin-top: 0; color: #94a3b8; text-transform: uppercase; }
    .host-row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 6px; margin-bottom: 10px; }
    .host-info { font-size: 15px; font-weight: 500; }
    .host-ip { color: #94a3b8; font-size: 13px; margin-left: 8px; }
    .btn { border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-block { background: #ef4444; color: white; }
    .btn-block:hover { background: #dc2626; }
    .btn-allow { background: #22c55e; color: white; }
    .btn-allow:hover { background: #16a34a; }
    .tag { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .tag-blocked { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .tag-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .log-box { background: #0b0f19; border: 1px solid #334155; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 13px; color: #38bdf8; height: 110px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡 Z-SDNet Policy Manager <span class="status-badge">REST Port: 8080</span></h1>
    <div class="card">
      <h2>Live Host Control & Zero-Trust Status</h2>
      <div id="hosts-container"></div>
    </div>
    <div class="card">
      <h2>Activity / Policy Logs</h2>
      <div class="log-box" id="log-box">> System initialized. Connecting to Ryu controller...</div>
    </div>
  </div>
  <script>
    const API_BASE = 'http://localhost:8080/firewall';
    const hosts = [
      { name: 'Host 1 (h1)', ip: '10.0.0.1' },
      { name: 'Host 2 (h2)', ip: '10.0.0.2' },
      { name: 'Host 3 (h3)', ip: '10.0.0.3' }
    ];
    function log(msg) {
      const box = document.getElementById('log-box');
      box.innerHTML = '> [' + new Date().toLocaleTimeString() + '] ' + msg + '<br>' + box.innerHTML;
    }
    async function fetchStatus() {
      try {
        const res = await fetch(API_BASE + '/status');
        const data = await res.json();
        renderHosts(data.blocked_ips || []);
      } catch (err) {
        log('Error connecting to Ryu API: ' + err.message);
      }
    }
    async function toggleHost(ip, isBlocked) {
      const endpoint = isBlocked ? API_BASE + '/allow' : API_BASE + '/block';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ip: ip })
        });
        const data = await res.json();
        log(data.message || 'Policy updated successfully');
        fetchStatus();
      } catch (err) {
        log('Action failed: ' + err.message);
      }
    }
    function renderHosts(blockedIps) {
      const container = document.getElementById('hosts-container');
      container.innerHTML = '';
      hosts.forEach(h => {
        const isBlocked = blockedIps.includes(h.ip);
        const row = document.createElement('div');
        row.className = 'host-row';
        row.innerHTML = '<div class="host-info"><span>' + h.name + '</span><span class="host-ip">(' + h.ip + ')</span></div>' +
          '<div><span class="tag ' + (isBlocked ? 'tag-blocked' : 'tag-active') + '">' + (isBlocked ? 'BLOCKED / ISOLATED' : 'TRUSTED / ACTIVE') + '</span>' +
          '<button class="btn ' + (isBlocked ? 'btn-allow' : 'btn-block') + '" style="margin-left: 12px;" onclick="toggleHost('' + h.ip + '', ' + isBlocked + ')">' +
          (isBlocked ? 'Allow Host' : 'Block Host') + '</button></div>';
        container.appendChild(row);
      });
    }
    fetchStatus();
    setInterval(fetchStatus, 3000);
  </script>
</body>
</html>
